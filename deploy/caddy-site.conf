# Bloc a ajouter a la fin de /etc/caddy/Caddyfile sur le serveur, puis :
#   systemctl reload caddy
#
# Meme forme que les sites deja presents (reverse_proxy vers un port local).
# HASH_A_REMPLACER : l'empreinte bcrypt du mot de passe du formateur, produite par
#   caddy hash-password --plaintext 'LE_MOT_DE_PASSE_CHOISI'
# Le mot de passe en clair n'est ecrit nulle part.

sorabel.178-104-184-125.sslip.io {
    encode gzip

    basic_auth {
        formateur HASH_A_REMPLACER
    }

    reverse_proxy localhost:8780
}
