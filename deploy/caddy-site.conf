# Bloc a ajouter a la fin de /etc/caddy/Caddyfile sur le serveur, puis :
#   systemctl reload caddy
#
# Meme forme que les sites deja presents (reverse_proxy vers un port local).
#
# Deux facons d'entrer, pour deux publics :
#   - l'interface web, protegee par identifiant + mot de passe (basic_auth) ;
#     HASH_A_REMPLACER = empreinte bcrypt, produite par
#       caddy hash-password --plaintext 'LE_MOT_DE_PASSE_CHOISI'
#   - trois serveurs MCP, un par profil, chacun derriere son propre jeton :
#     JETON_SUPPORT / JETON_COMMERCIAL / JETON_DEVELOPER, produits par
#       openssl rand -hex 24
#     Le jeton EST le profil : un client qui presente le jeton commercial parle
#     au serveur commercial, et a personne d'autre. Aucun formulaire ne choisit.
#
# Ni mot de passe ni jeton en clair dans le depot : seul ce modele est commite.

sorabel.178-104-184-125.sslip.io {
    encode gzip

    # --- serveurs MCP en streamable-http, un par profil ---
    @mcp_support {
        path /mcp/support /mcp/support/*
        header Authorization "Bearer JETON_SUPPORT"
    }
    handle @mcp_support {
        reverse_proxy localhost:8791
    }

    @mcp_commercial {
        path /mcp/commercial /mcp/commercial/*
        header Authorization "Bearer JETON_COMMERCIAL"
    }
    handle @mcp_commercial {
        reverse_proxy localhost:8792
    }

    @mcp_developer {
        path /mcp/developer /mcp/developer/*
        header Authorization "Bearer JETON_DEVELOPER"
    }
    handle @mcp_developer {
        reverse_proxy localhost:8793
    }

    # Un chemin /mcp/... sans le bon jeton : refus explicite, rien d'autre.
    @mcp_sans_jeton path /mcp/*
    handle @mcp_sans_jeton {
        respond "Jeton MCP manquant ou invalide." 401
    }

    # --- l'interface web, pour le formateur ---
    handle {
        basic_auth {
            formateur HASH_A_REMPLACER
        }
        reverse_proxy localhost:8780
    }
}
